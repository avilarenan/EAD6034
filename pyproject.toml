[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ead6034-seminario"
version = "0.3.0"
description = "Analise empirica de previsibilidade linear em dados intradiarios da B3"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "scipy>=1.12",
  "statsmodels>=0.14",
  "arch>=7.2",
  "reportlab>=4.0",
]

[project.scripts]
ead6034-entrega = "ead6034.pipeline:main"
ead6034-entrega-multiescala = "ead6034.multiscale_pipeline:main"
ead6034-entrega-box-jenkins = "ead6034.box_jenkins:main"

[tool.setuptools.packages.find]
where = ["src"]
